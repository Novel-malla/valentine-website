<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container" id="questionBox">
    <h1>Will you be my Valentine? 💕</h1>

    <div class="buttons">
      <button id="yesBtn">Yes 😍</button>
      <button id="noBtn">No 😢</button>
    </div>
  </div>

  <div class="container hidden" id="yesBox">
    <h1>To My Valentine 💖</h1>

    <p id="loveText"></p>

    <button id="nextBtn">Next 💌</button>
  </div>

  <div class="container hidden" id="galleryBox">
    <h1>Our Memories 📸</h1>

    <div class="gallery">
      <img src="images/pic1.jpeg" alt="memory">
      <img src="images/pic2.jpeg" alt="memory">
      <img src="images/pic3.jpeg" alt="memory">
      <img src="images/pic4.jpeg" alt="memory">
    </div>

    <button id="galleryNextBtn">Next 💖</button>
  </div>

  <div class="container hidden" id="timerBox">
    <h1>Our Time Together ⏳</h1>

    <p class="timer-text">
      We've been together for
    </p>

    <div class="timer">
      <div>
        <span id="days">0</span>
        <small>Days</small>
      </div>
      <div>
        <span id="hours">0</span>
        <small>Hours</small>
      </div>
      <div>
        <span id="minutes">0</span>
        <small>Minutes</small>
      </div>
      <div>
        <span id="seconds">0</span>
        <small>Seconds</small>
      </div>
    </div>

    <button id="timerNextBtn">Next 💍</button>
  </div>

  <script src="script.js"></script>
</body>

</html>
